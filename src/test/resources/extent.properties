# ============================================================
# EXTENT REPORT CONFIGURATION
# ============================================================

# Spark HTML
extent.reporter.spark.start=true
extent.reporter.spark.out=SparkReport/ExtentSpark.html

# PDF
extent.reporter.pdf.start=true
extent.reporter.pdf.out=PdfReport/ExtentPdf.pdf

# HTML
extent.reporter.html.start=true
extent.reporter.html.out=HtmlReport/ExtentHtml.html


# ============================================================
# BASE REPORT LOCATION
# ============================================================

basefolder.name=target/ExtentReports
basefolder.datetimepattern=d-MMM-YY HH-mm-ss


# ============================================================
# SCREENSHOTS
# ============================================================

screenshot.dir=Screenshots/
screenshot.rel.path=../Screenshots/


# ============================================================
# SPARK CONFIGURATION
# ============================================================

extent.reporter.spark.vieworder=dashboard,test,category,exception,author,device,log

extent.reporter.spark.base64imagesrc=false


# ============================================================
# SYSTEM INFORMATION
# ============================================================

systeminfo.Project=Influency
systeminfo.Module=Enquiry Management
systeminfo.Tester=Avneesh Yadav
systeminfo.Environment=QA
systeminfo.Browser=Chromium
systeminfo.Framework=Cucumber BDD + Playwright
systeminfo.Automation=Playwright
systeminfo.Language=Java
systeminfo.Build=1.0.0
systeminfo.OS=MacOS